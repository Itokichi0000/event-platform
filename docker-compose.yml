# Self-hosting: `cp .env.example .env`, set KAMEN_MASTER_KEY and KAMEN_DOMAIN, then
#   docker compose up -d --build
services:
  server:
    build: { context: ., target: server }
    restart: unless-stopped
    environment:
      KAMEN_MASTER_KEY: ${KAMEN_MASTER_KEY:?set KAMEN_MASTER_KEY (openssl rand -hex 32)}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      POW_DIFFICULTY: ${POW_DIFFICULTY:-18}
    volumes:
      - kamen-data:/data
    # The API is reachable only through Caddy.
    expose:
      - '8787'

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    depends_on: [server]
    environment:
      KAMEN_DOMAIN: ${KAMEN_DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  kamen-data:
  caddy-data:
  caddy-config:
